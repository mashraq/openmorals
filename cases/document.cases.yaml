# The document guard (0.18.0): asks before a write or command deletes a document, leaves a file empty, removes more
# than 25% of a document (and at least 512 bytes) or removes a heading, and when it cannot tell. Each row's `files`
# says what is on disk (every other path is missing); rows run in /work/app.
guard: document
x-docs:
  guide: &guide { text: "## Section\n\nA paragraph of the guide that carries real content for a reader.\n\n", repeat: 30 }
  notes: &notes { text: "Meeting notes: decisions taken, owners named, dates agreed.\n", repeat: 40 }
  readme: &readme "# Project\n\nWhat it does.\n\n## Install\n\nRun the installer.\n\n```bash\n# install the tools\nnpm install\n```\n\n## Use\n\nRun it.\n"
  plan: &plan "# Plan\n\nKeep this line.\nDrop this line, it repeats and carries the bulk of the file.\nDrop this line, it repeats and carries the bulk of the file.\nDrop this line, it repeats and carries the bulk of the file.\nDrop this line, it repeats and carries the bulk of the file.\nDrop this line, it repeats and carries the bulk of the file.\nDrop this line, it repeats and carries the bulk of the file.\nDrop this line, it repeats and carries the bulk of the file.\nDrop this line, it repeats and carries the bulk of the file.\nDrop this line, it repeats and carries the bulk of the file.\nDrop this line, it repeats and carries the bulk of the file.\n"
  code: &code { text: "export function step(n: number): number {\n  return n + 1;\n}\n", repeat: 60 }
cases:
  # --- writes and edits that remove a lot, empty a file or drop a heading: ask
  - { tool: Write, input: { file_path: /work/app/docs/guide.md, content: "" }, files: { docs/guide.md: *guide }, expect: ask, rule: document.empty }
  - { tool: Write, input: { file_path: /work/app/docs/guide.md, content: "   \n\n" }, files: { docs/guide.md: *guide }, expect: ask, rule: document.empty, note: "whitespace only counts as empty" }
  - { tool: Write, input: { file_path: /work/app/docs/guide.md, content: "## Section\n\nShort now.\n" }, files: { docs/guide.md: *guide }, expect: ask, rule: document.shrink }
  - { tool: Write, input: { file_path: /work/app/notes.txt, content: "Meeting notes: kept the first line only.\n" }, files: { notes.txt: *notes }, expect: ask, rule: document.shrink }
  - { tool: Edit, input: { file_path: /work/app/plan.md, old_string: "Drop this line, it repeats and carries the bulk of the file.\n", new_string: "", replace_all: true }, files: { plan.md: *plan }, expect: ask, rule: document.shrink }
  - { tool: Edit, input: { file_path: /work/app/notes.txt, old_string: "Meeting notes: decisions taken, owners named, dates agreed.\n", new_string: "", replace_all: true }, files: { notes.txt: *notes }, expect: ask, rule: document.empty }
  - { tool: Edit, input: { file_path: /work/app/README.md, old_string: "## Install\n\nRun the installer.\n", new_string: "Run the installer.\n" }, files: { README.md: *readme }, expect: ask, rule: document.heading }
  - { tool: Edit, input: { file_path: /work/app/docs/guide.md, old_string: "## Section\n\n", new_string: "", replace_all: true }, files: { docs/guide.md: *guide }, expect: ask, rule: document.heading, note: "30 headings, 360 bytes: under the byte floor, still a heading loss" }
  - { tool: MultiEdit, input: { file_path: /work/app/README.md, edits: [{ old_string: "## Use\n\n", new_string: "" }, { old_string: "What it does.", new_string: "What it does, briefly." }] }, files: { README.md: *readme }, expect: ask, rule: document.heading }
  - { tool: Write, input: { file_path: /work/app/README.md, content: "# Project\n\nWhat it does.\n\nRun the installer, then run it. Both steps are short and the same on every system.\n" }, files: { README.md: *readme }, expect: ask, rule: document.heading }
  - { tool: Write, input: { file_path: /work/app/report.pdf, content: "" }, files: { report.pdf: { bytes: 48000 } }, expect: ask, rule: document.empty }
  - { tool: Write, input: { file_path: /work/app/src/app.ts, content: "" }, files: { src/app.ts: *code }, expect: ask, rule: document.empty, note: "emptying counts for any file, not only documents" }
  # --- cannot tell: ask
  - { tool: Write, input: { file_path: /work/app/docs/guide.md, content: "x" }, files: { docs/guide.md: { error: EACCES } }, expect: ask, rule: document.unreadable }
  - { tool: Write, input: { file_path: /work/app/docs/guide.md }, files: { docs/guide.md: *guide }, expect: ask, rule: document.unknown, note: "no content field" }
  - { tool: Edit, input: { file_path: /work/app/docs/guide.md, new_string: "replacement" }, files: { docs/guide.md: *guide }, expect: ask, rule: document.unknown, note: "no old_string: which text is replaced is not given" }
  - { tool: Edit, input: { file_path: /work/app/big.txt, old_string: "row", new_string: "", replace_all: true }, files: { big.txt: { bytes: 300000 } }, expect: ask, rule: document.unknown, note: "every occurrence, in a file over the 262,144 bytes read" }
  - { tool: mcp__files__write_file, input: { path: docs/guide.md, content: "new text" }, files: { docs/guide.md: *guide }, expect: ask, rule: document.unknown, note: "an MCP write names only the path to the guard" }
  # --- shell commands: ask
  - { cmd: "rm docs/guide.md", files: { docs/guide.md: *guide }, expect: ask, rule: document.delete }
  - { cmd: "unlink notes.txt", files: { notes.txt: *notes }, expect: ask, rule: document.delete }
  - { cmd: "git rm -q docs/guide.md", files: { docs/guide.md: *guide }, expect: ask, rule: document.delete }
  - { cmd: "mv docs/guide.md /tmp/old-guide.md", files: { docs/guide.md: *guide }, expect: ask, rule: document.delete, note: "moved out of the project folder" }
  - { cmd: "> docs/guide.md", files: { docs/guide.md: *guide }, expect: ask, rule: document.empty }
  - { cmd: ": > notes.txt", files: { notes.txt: *notes }, expect: ask, rule: document.empty }
  - { cmd: "cp /dev/null docs/guide.md", files: { docs/guide.md: *guide }, expect: ask, rule: document.empty }
  - { cmd: "> server.log", files: { server.log: { bytes: 3000 } }, expect: ask, rule: document.empty, note: "emptying counts for any file" }
  - { cmd: "cat > README.md <<'EOF'\n# Project\nEOF", files: { README.md: *readme }, expect: ask, rule: document.unknown, note: "a heredoc overwrite: the new text is not given to the guard" }
  - { cmd: "npm test > notes.txt", files: { notes.txt: *notes }, expect: ask, rule: document.unknown }
  - { cmd: "mv draft.md docs/guide.md", files: { draft.md: "# Draft\n", docs/guide.md: *guide }, expect: ask, rule: document.unknown, note: "overwrites an existing document with another file" }
  - { cmd: "Remove-Item notes.md", shell: powershell, files: { notes.md: *notes }, expect: ask, rule: document.delete }
  - { cmd: "Clear-Content notes.txt", shell: powershell, files: { notes.txt: *notes }, expect: ask, rule: document.empty }
  - { cmd: "rm -f docs/guide.md", files: { docs/guide.md: *guide }, expect: ask, rule: destructive.recursive-delete, note: "the destructive guard owns forced deletes; the document guard does not ask again" }
  # --- ordinary work: allow
  - { tool: Write, input: { file_path: /work/app/docs/guide.md, content: "## Section\n\nA paragraph of the guide that carries real content for a reader.\n\n## New section\n\nAdded at the end.\n" }, files: { docs/guide.md: "## Section\n\nA paragraph of the guide that carries real content for a reader.\n\n" }, expect: allow, note: "an append" }
  - { tool: Edit, input: { file_path: /work/app/docs/guide.md, old_string: "## Section\n\nA paragraph", new_string: "## Section\n\nA reworded paragraph" }, files: { docs/guide.md: *guide }, expect: allow }
  - { tool: Edit, input: { file_path: /work/app/README.md, old_string: "## Install", new_string: "## Installation" }, files: { README.md: *readme }, expect: allow, note: "a renamed heading is not a removed one" }
  - { tool: Edit, input: { file_path: /work/app/README.md, old_string: "# install the tools\nnpm install", new_string: "npm ci" }, files: { README.md: *readme }, expect: allow, note: "a # line inside a code fence is not a heading" }
  - { tool: Edit, input: { file_path: /work/app/CHANGELOG.md, old_string: "# Changelog\n", new_string: "# Changelog\n\n## 1.1.0\n\n- Added a thing.\n" }, files: { CHANGELOG.md: "# Changelog\n\n## 1.0.0\n\n- First release.\n" }, expect: allow }
  - { tool: Write, input: { file_path: /work/app/src/app.ts, content: "export const x = 1;\n" }, files: { src/app.ts: *code }, expect: allow, note: "code is not a document: a big rewrite of it is not asked about" }
  - { tool: Write, input: { file_path: /work/app/package-lock.json, content: "{ \"lockfileVersion\": 3 }\n" }, files: { package-lock.json: { bytes: 90000 } }, expect: allow, note: "a lockfile regenerated smaller" }
  - { tool: Write, input: { file_path: /work/app/docs/new-page.md, content: "# New\n" }, expect: allow, note: "a new file" }
  - { tool: Write, input: { file_path: /work/app/TODO.md, content: "# Todo\n\n- one left\n" }, files: { TODO.md: "# Todo\n\n- write the tests\n- fix the docs\n- one left\n- ship it\n" }, expect: allow, note: "a small file rewritten: under the 512-byte floor" }
  - { tool: Write, input: { file_path: /work/app/node_modules/pkg/README.md, content: "" }, files: { node_modules/pkg/README.md: *guide }, expect: allow, note: "excluded folder" }
  - { tool: Write, input: { file_path: /work/app/dist/docs/api.md, content: "# API\n" }, files: { dist/docs/api.md: *guide }, expect: allow, note: "generated output, excluded" }
  - { tool: Write, input: { file_path: /work/app/notes.txt, content: "Meeting notes: decisions taken, owners named, dates agreed, and one more line.\n" }, files: { notes.txt: "Meeting notes: decisions taken, owners named, dates agreed.\n" }, expect: allow }
  - { cmd: "echo 'one more line' >> notes.txt", files: { notes.txt: *notes }, expect: allow }
  - { cmd: "rm server.log", files: { server.log: { bytes: 3000 } }, bylaws: { version: 1, guards: { delete: { decision: allow } } }, expect: allow, note: "not a document: the document guard alone does not ask (0.21.0: with the delete guard on, delete.cases.yaml refuses it)" }
  - { cmd: "git rm --cached docs/guide.md", files: { docs/guide.md: *guide }, expect: allow }
  - { cmd: "mv docs/guide.md docs/handbook.md", files: { docs/guide.md: *guide }, expect: allow, note: "renamed inside the project" }
  - { cmd: "rm docs/old.md", expect: allow, note: "nothing there" }
  - { cmd: "cat docs/guide.md", files: { docs/guide.md: *guide }, expect: allow }
  - { cmd: "npm test > test-output.log 2>&1", files: { test-output.log: { bytes: 2000 } }, expect: allow, note: "overwriting a non-document with output" }
