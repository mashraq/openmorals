# Oracle for the self-protect guard: the agent should not quietly rewrite the
# rules it works under, the hook that enforces them, or the record of what it did.
guard: self-protect
cases:
  - { tool: Write, input: { file_path: "/work/app/openmorals.yaml", content: "version: 1" }, expect: ask, rule: self-protect.write }
  - { tool: Edit, input: { file_path: "/work/app/.claude/settings.json", old_string: "a", new_string: "b" }, expect: ask }
  - { tool: Write, input: { file_path: "/work/app/.claude/settings.local.json", content: "{}" }, expect: ask }
  - { tool: Write, input: { file_path: "C:\\work\\app\\OpenMorals.yml", content: "" }, expect: ask, note: "case-insensitive, Windows separators" }
  - { tool: Read, input: { file_path: "/work/app/openmorals.yaml" }, expect: allow, note: "reading the rules is fine" }
  - { tool: Write, input: { file_path: "/work/app/src/main.ts", content: "" }, expect: allow }
  - { cmd: "echo 'version: 1' > openmorals.yaml", expect: ask, rule: self-protect.write }
  - { cmd: "sed -i 's/ask/allow/' openmorals.yaml", expect: ask }
  - { cmd: "mv openmorals.yaml openmorals.yaml.off", expect: ask }
  - { cmd: "rm openmorals.yaml", expect: ask }
  - { cmd: "cp /tmp/x.json .claude/settings.json", expect: ask }
  - { cmd: "truncate -s 0 ~/.config/openmorals/audit.jsonl", expect: ask, note: "the destructive guard also fires; either rule is acceptable", rule_any: true }
  - { cmd: "rm -rf ~/.config/openmorals/sessions", expect: ask, rule_any: true }
  - { cmd: "cat openmorals.yaml", expect: allow }
  - { cmd: "grep -n decision openmorals.yaml", expect: allow }
  - { cmd: "git diff openmorals.yaml", expect: allow }
  - { cmd: "jq . .claude/settings.json", expect: allow }
  - { cmd: "Set-Content -Path openmorals.yaml -Value 'x'", shell: powershell, expect: ask }
  - { cmd: "sed -i 's/ask/allow/' openmorals.yaml", expect: allow, bylaws: { version: 1, guards: { self-protect: { decision: allow } } } }
  # the per-project undo state (.openmorals/: trash folder and undo log)
  - { cmd: "rm .openmorals/undo.jsonl", expect: ask, rule: self-protect.write }
  - { cmd: "echo '' > .openmorals/undo.jsonl", expect: ask, rule: self-protect.write }
  - { cmd: "rm -rf .openmorals/trash", expect: ask, rule_any: true }
  - { tool: Write, input: { file_path: "/work/app/.openmorals/undo.jsonl", content: "" }, expect: ask, rule: self-protect.write }
  - { tool: Edit, input: { file_path: "C:\\work\\app\\.openmorals\\undo.jsonl", old_string: "a", new_string: "b" }, expect: ask }
  - { cmd: "ls .openmorals/trash", expect: allow }
  - { cmd: "cat .openmorals/undo.jsonl", expect: allow }
  - { tool: Write, input: { file_path: "/work/app/docs/openmorals-notes.md", content: "" }, expect: allow, note: "only the .openmorals folder itself is protected" }
  # the CLI subcommands that rewrite the guard's own files
  - { cmd: "openmorals purge --older-than 0 --yes", expect: ask, rule: self-protect.write }
  - { cmd: "openmorals init --pack solo-dev", expect: ask, rule: self-protect.write }
  - { cmd: "openmorals check 'rm -rf x'", expect: allow }
  - { cmd: "openmorals trash build/old.log", expect: allow, note: "moving a file into the trash is the recoverable path" }
  - { cmd: "openmorals restore 20260101-000000-abcd", expect: allow }
  # the person-only subcommands (0.19.0): an agent cannot approve its own held action
  - { cmd: "openmorals approve D-7KQ2-X9MF3H", expect: ask, rule: self-protect.write }
  - { cmd: "openmorals approve D-7KQ2", expect: ask, rule: self-protect.write }
  - { cmd: "npx openmorals approve D-7KQ2-X9MF3H", expect: ask, rule: self-protect.write }
  - { cmd: "bun x openmorals approve D-7KQ2-X9MF3H", expect: ask, rule: self-protect.write }
  # stop and its clear are the person's (0.36.0): an agent can neither halt a session nor restart one
  - { cmd: "openmorals stop --clear", expect: ask, rule: self-protect.write }
  - { cmd: "openmorals stop --clear 8f2c-session", expect: ask, rule: self-protect.write }
  - { cmd: "openmorals stop 8f2c-session", expect: ask, rule: self-protect.write }
  - { cmd: "openmorals stop --all", expect: ask, rule: self-protect.write }
  - { cmd: "openmorals sessions --json", expect: allow }
  - { cmd: "node /opt/tools/openmorals/dist/src/cli.js approve D-7KQ2-X9MF3H", expect: ask, rule: self-protect.write, note: "the built entry run by node" }
  - { cmd: "node ./node_modules/.bin/openmorals approve D-7KQ2", expect: ask, rule: self-protect.write }
  - { cmd: "node /opt/tools/openmorals/dist/src/cli.js init", expect: ask, rule: self-protect.write }
  - { cmd: "cd /tmp && openmorals approve D-7KQ2-X9MF3H", expect: ask, rule: self-protect.write }
  - { cmd: "openmorals release agent-1", expect: ask, rule: self-protect.write }
  - { cmd: "openmorals accept proposal-3", expect: ask, rule: self-protect.write }
  # the hook reads the host's events (0.41.0): an agent that pipes its own event into it is asked about
  - { cmd: "echo '{\"session_id\":\"s1\",\"hook_event_name\":\"PostToolUse\",\"tool_name\":\"NewTool\",\"tool_input\":{}}' | openmorals hook", expect: ask, rule: self-protect.write, note: "a forged post-tool event" }
  - { cmd: "openmorals hook codex < /tmp/event.json", expect: ask, rule: self-protect.write }
  - { cmd: "npx openmorals hook gemini-cli < event.json", expect: ask, rule: self-protect.write }
  - { cmd: "node /opt/tools/openmorals/dist/src/cli.js hook", expect: ask, rule: self-protect.write }
  - { cmd: "openmorals hook --help", expect: allow }
  - { cmd: "openmorals help hook", expect: allow }
  - { cmd: "echo openmorals hook", expect: allow, note: "the words only, nothing runs the hook" }
  - { cmd: "git commit -m 'docs: how openmorals hook reads events'", expect: allow }
  - { cmd: "grep -n 'openmorals hook' README.md", expect: allow }
  - { cmd: "openmorals pending", expect: allow, note: "listing what is held shows no code" }
  - { cmd: "openmorals pending --all --json", expect: allow }
  - { cmd: "openmorals refuse D-7KQ2", expect: allow, note: "saying no only stops an action" }
  - { cmd: "node scripts/approve.js approve D-7KQ2", expect: allow, note: "not the openmorals entry point" }
  - { cmd: "node /opt/tools/openmorals/dist/src/cli.js pending", expect: allow }
  # 0.27.0: approving a work order (and recording its baseline) is the person's; its store and templates are protected
  - { cmd: "openmorals order approve work-order.yaml", expect: ask, rule: self-protect.write }
  - { cmd: "openmorals order approve work-order.yaml --yes", expect: ask, rule: self-protect.write }
  - { cmd: "npx openmorals order approve work-order.yaml", expect: ask, rule: self-protect.write }
  - { cmd: "node /opt/tools/openmorals/dist/src/cli.js order approve work-order.yaml", expect: ask, rule: self-protect.write }
  - { cmd: "openmorals order baseline work-order.yaml", expect: ask, rule: self-protect.write }
  - { tool: Write, input: { file_path: "/home/u/.config/openmorals/orders/approvals.jsonl", content: "{}" }, expect: ask, rule: self-protect.write }
  - { tool: Write, input: { file_path: "/srv/state/openmorals/order-templates/quarter.yaml", content: "version: 1" }, expect: ask, rule: self-protect.write, note: "the folder name, wherever the config directory is" }
  - { cmd: "echo '{}' >> ~/.config/openmorals/orders/approvals.jsonl", expect: ask, rule: self-protect.write }
  - { cmd: "openmorals order check work-order.yaml", expect: allow, note: "checking is anyone's" }
  - { cmd: "openmorals order new --kind data --input data/in.csv", expect: allow }
  - { cmd: "openmorals order approve --help", expect: allow, note: "help writes nothing" }
  - { cmd: "openmorals order check approve.yaml", expect: allow }
  - { cmd: "cat ~/.config/openmorals/orders/approvals.jsonl", expect: allow }
  - { tool: Write, input: { file_path: "/work/app/docs/orders/q3.yaml", content: "version: 1" }, expect: allow, note: "a work order in the project is the agent's to write" }
  # the command after `openmorals run --` is judged as if typed (0.44.0)
  - { cmd: "openmorals run --agent claude-code -- openmorals init --agent codex", expect: ask, rule: self-protect.write }
  - { cmd: "openmorals run -- sh -c 'echo x > openmorals.yaml'", expect: ask, rule: self-protect.write }
  - { cmd: "openmorals run -- openmorals approve D-7KQ2-X9MF3H", expect: ask, rule: self-protect.write }
  - { cmd: "openmorals run -- openmorals run --tokens 999 -- claude", expect: ask, rule: self-protect.write, note: "a fresh budget set by the inner run" }
  - { cmd: "openmorals run -- openmorals check 'rm -rf x'", expect: allow }
  - { cmd: "openmorals run -- cat openmorals.yaml", expect: allow }
  # the hook configuration of the other hosts openmorals supports (Codex, Gemini CLI, opencode)
  - { tool: Write, input: { file_path: "/work/app/.codex/hooks.json", content: "{}" }, expect: ask, rule: self-protect.write }
  - { tool: Edit, input: { file_path: "/work/app/.codex/config.toml", old_string: "a", new_string: "b" }, expect: ask }
  - { tool: Write, input: { file_path: "/work/app/.gemini/settings.json", content: "{}" }, expect: ask }
  - { tool: Write, input: { file_path: "/work/app/.opencode/plugins/openmorals.js", content: "" }, expect: ask }
  - { tool: Write, input: { file_path: "/work/app/opencode.json", content: "{}" }, expect: ask }
  - { tool: Write, input: { file_path: "/work/app/opencode.jsonc", content: "{}" }, expect: ask }
  - { cmd: "rm .opencode/plugins/openmorals.js", expect: ask, rule: self-protect.write }
  - { cmd: "echo '{}' > .codex/hooks.json", expect: ask, rule: self-protect.write }
  - { cmd: "sed -i 's/hook gemini-cli/true/' .gemini/settings.json", expect: ask, rule: self-protect.write }
  - { cmd: "mv ~/.codex/hooks.json /tmp/off.json", expect: ask, rule: self-protect.write }
  - { cmd: "rm -rf .opencode/plugins", expect: ask, rule_any: true }
  - { cmd: "cat .codex/hooks.json", expect: allow }
  - { cmd: "jq .hooks .gemini/settings.json", expect: allow }
  - { tool: Write, input: { file_path: "/work/app/.gemini/notes.md", content: "" }, expect: allow, note: "only the settings file is protected" }
  - { tool: Write, input: { file_path: "/work/app/.opencode/agent/review.md", content: "" }, expect: allow, note: "only the plugins folder is protected" }
  - { tool: Write, input: { file_path: "/work/app/.codex/requirements.toml", content: "" }, expect: ask }
  - { cmd: "rm ~/.config/opencode/plugins/openmorals.js", expect: ask, rule: self-protect.write, note: "user-level opencode plugins" }
  - { cmd: "cp /tmp/x.json ~/.config/gemini-cli/settings.json", expect: ask, rule: self-protect.write }
  # 0.5.0: the content-scanning hooks live in the same files, so removing just them is a self-protect matter too
  - { cmd: "jq 'del(.hooks.UserPromptSubmit)' .claude/settings.json > s.json && mv s.json .claude/settings.json", expect: ask, rule: self-protect.write }
  - { cmd: "sed -i '/PostToolUse/d' .codex/hooks.json", expect: ask, rule: self-protect.write }
  - { tool: Edit, input: { file_path: "/work/app/.gemini/settings.json", old_string: "\"AfterTool\"", new_string: "\"Off\"" }, expect: ask, rule: self-protect.write }
  - { tool: Write, input: { file_path: "/work/app/.opencode/plugins/openmorals.js", content: "export default {}" }, expect: ask, rule: self-protect.write }
  # 0.6.2: the real config directory from configDir(), whatever OPENMORALS_HOME names it (rows are judged with
  # home /home/u, config directory /home/u/.config/openmorals and working directory /work/app unless they say otherwise)
  - { tool: Write, input: { file_path: "/tmp/x/audit.jsonl", content: "" }, config_dir: "/tmp/x", expect: ask, rule: self-protect.write }
  - { tool: Write, input: { file_path: "/srv/guard-state/sessions/s1.json", content: "{}" }, config_dir: "/srv/guard-state", expect: ask, rule: self-protect.write }
  - { cmd: "echo '' > /tmp/x/audit.jsonl", config_dir: "/tmp/x", expect: ask, rule: self-protect.write }
  - { cmd: "rm $OPENMORALS_HOME/audit.jsonl", config_dir: "/tmp/x", expect: ask, rule: self-protect.write }
  - { cmd: "cp /dev/null audit.jsonl", cwd: "/tmp/x", config_dir: "/tmp/x", expect: ask, rule: self-protect.write, note: "a relative path read from the working directory" }
  - { tool: Write, input: { file_path: "D:\\agent-state\\audit.jsonl", content: "" }, config_dir: "D:\\agent-state", expect: ask, rule: self-protect.write }
  - { cmd: "Remove-Item D:\\agent-state\\audit.jsonl", shell: powershell, config_dir: "D:\\agent-state", expect: ask, rule: self-protect.write }
  - { tool: Write, input: { file_path: "/tmp/xy/audit.jsonl", content: "" }, config_dir: "/tmp/x", expect: allow, note: "a sibling whose name starts the same is not inside" }
  - { cmd: "cat /tmp/x/audit.jsonl", config_dir: "/tmp/x", expect: allow }
  - { cmd: "ls -la /tmp/x", config_dir: "/tmp/x", expect: allow }
  # the config directory and every folder above it, as an argument to a command that moves, removes, copies onto, links or extracts
  - { cmd: "mv ~/.config/openmorals /tmp/off", expect: ask, rule: self-protect.write }
  - { cmd: "mv ~/.config /tmp/off", expect: ask, rule: self-protect.write }
  - { cmd: "mv ~ /tmp/home-off", expect: ask, rule: self-protect.write }
  - { cmd: "mv /tmp/x /tmp/y", config_dir: "/tmp/x/state", expect: ask, rule: self-protect.write }
  - { cmd: "cp -r /tmp/fake ~/.config/openmorals", expect: ask, rule: self-protect.write }
  - { cmd: "cp -r /tmp/openmorals ~/.config", expect: ask, rule: self-protect.write, note: "lands on the config directory" }
  - { cmd: "cp -r dotfiles/. ~", expect: ask, rule: self-protect.write, note: "the contents land in home, where .config may be replaced" }
  - { cmd: "ln -s ~/.config/openmorals d", expect: ask, rule: self-protect.write }
  - { cmd: "rsync -a empty/ ~/", expect: ask, rule: self-protect.write }
  - { cmd: "tar -xzf dots.tgz -C ~", expect: ask, rule: self-protect.write }
  - { cmd: "rmdir ~/.config/openmorals", expect: ask, rule: self-protect.write }
  - { cmd: "chmod -R 000 ~/.config", expect: ask, rule: self-protect.write }
  - { cmd: "Move-Item -Path $env:APPDATA\\openmorals -Destination C:\\off", shell: powershell, expect: ask, rule: self-protect.write }
  - { cmd: "move %APPDATA%\\openmorals C:\\off", shell: cmd, expect: ask, rule: self-protect.write }
  - { cmd: "Rename-Item C:\\Users\\u\\AppData\\Roaming\\openmorals off", shell: powershell, expect: ask, rule: self-protect.write }
  - { cmd: "openmorals trash ~/.config/openmorals/audit.jsonl", expect: ask, rule: self-protect.write }
  - { cmd: "cp notes.txt ~", expect: allow, note: "a file copied into home cannot replace the config directory" }
  - { cmd: "mv build.log ~/.config", expect: allow, note: "lands at ~/.config/build.log" }
  - { cmd: "tar -czf backup.tgz ~/.config", expect: allow, note: "making an archive only reads" }
  - { cmd: "cp -r ~/.config/nvim /tmp/nvim-backup", expect: allow }
  - { cmd: "find ~/.config -name '*.json'", expect: allow }
  - { cmd: "cd ~/.config/openmorals", expect: allow }
  - { cmd: "du -sh ~/.config/openmorals", expect: allow }
  - { cmd: "tail -n 20 ~/.config/openmorals/audit.jsonl", expect: allow }
  - { cmd: "ls ~/.config/openmorals/sessions", expect: allow }
  - { cmd: "Get-Content $env:APPDATA\\openmorals\\audit.jsonl", shell: powershell, expect: allow }
  - { cmd: "openmorals audit --tail 5", expect: allow }
  # a protected path inside any argument, such as the body of an interpreter one-liner
  - { cmd: "python3 -c \"open('/home/u/.config/openmorals/audit.jsonl','w')\"", expect: ask, rule: self-protect.write }
  - { cmd: "node -e \"require('fs').writeFileSync('/home/u/.config/openmorals/audit.jsonl','')\"", expect: ask, rule: self-protect.write }
  - { cmd: "python3 -c \"import shutil; shutil.move('/tmp/x', '/tmp/y')\"", config_dir: "/tmp/x", expect: ask, rule: self-protect.write }
  - { cmd: "python3 -c \"import os; os.rename('/home/u/.config', '/tmp/c')\"", expect: ask, rule: self-protect.write, note: "a folder above the config directory, named in code" }
  - { cmd: "perl -e 'unlink \"/home/u/.config/openmorals/sessions/s1.json\"'", expect: ask, rule: self-protect.write }
  - { cmd: "ruby -e \"File.write('openmorals.yaml', '')\"", expect: ask, rule: self-protect.write }
  - { cmd: "python -c \"open(r'C:\\Users\\u\\AppData\\Roaming\\openmorals\\audit.jsonl','w')\"", expect: ask, rule: self-protect.write }
  - { cmd: "python3 -c \"print(1+1)\"", expect: allow }
  - { cmd: "node -e \"console.log(require('os').homedir())\"", expect: allow }
  - { cmd: "python3 -c \"import json; print(json.load(open('package.json')))\"", expect: allow }
  - { cmd: "python3 -c \"import os; print(os.listdir('/home/u'))\"", expect: allow, note: "home itself is not singled out inside code" }
  # links: a relative link target is read from the link's own folder
  - { cmd: "ln -s ../../state/om sub/d", cwd: "/srv/work", config_dir: "/srv/state/om", expect: ask, rule: self-protect.write }
  - { cmd: "New-Item -ItemType SymbolicLink -Path d -Target C:\\agent-state", shell: powershell, config_dir: "C:\\agent-state", expect: ask, rule: self-protect.write }
  - { cmd: "ln -s ../shared/config.json config.json", cwd: "/srv/work", config_dir: "/srv/state/om", expect: allow }
  # 0.32.0: git hooks and hook managers are checks the agent must not edit, move or remove
  - { tool: Write, input: { file_path: "/work/app/.git/hooks/pre-commit", content: "exit 0" }, expect: ask, rule: self-protect.write }
  - { tool: Edit, input: { file_path: "/work/app/.husky/pre-push", old_string: "npm test", new_string: "true" }, expect: ask, rule: self-protect.write }
  - { tool: Write, input: { file_path: "/work/app/.pre-commit-config.yaml", content: "repos: []" }, expect: ask, rule: self-protect.write }
  - { tool: Write, input: { file_path: "/work/app/lefthook.yml", content: "pre-commit: {}" }, expect: ask, rule: self-protect.write }
  - { tool: Write, input: { file_path: "/work/app/.lefthook.yaml", content: "" }, expect: ask, rule: self-protect.write }
  - { tool: Write, input: { file_path: "C:\\work\\app\\.githooks\\pre-commit", content: "" }, expect: ask, rule: self-protect.write, note: "Windows separators" }
  - { cmd: "echo 'exit 0' > .git/hooks/pre-commit", expect: ask, rule: self-protect.write }
  - { cmd: "rm .husky/pre-commit", expect: ask, rule_any: true, note: "the delete guard may also fire" }
  - { cmd: "chmod -x .git/hooks/pre-push", expect: ask, rule: self-protect.write }
  - { cmd: "sed -i 's/npm test/true/' .husky/pre-push", expect: ask, rule: self-protect.write }
  - { cmd: "mv .pre-commit-config.yaml .pre-commit-config.yaml.off", expect: ask, rule_any: true }
  - { cmd: "git config core.hooksPath /dev/null", expect: ask, rule: self-protect.write }
  - { cmd: "git config --local core.hooksPath .nohooks", expect: ask, rule: self-protect.write }
  - { cmd: "git -c core.hooksPath=/dev/null commit -m wip", expect: ask, rule: self-protect.write }
  - { cmd: "git -C sub -c core.hookspath=x push", expect: ask, rule: self-protect.write, note: "the key is case-insensitive" }
  - { cmd: "git config core.hooksPath", expect: allow, note: "reading the setting" }
  - { cmd: "git config --unset core.hooksPath", expect: allow, note: "unsetting restores the project's own hooks" }
  - { cmd: "git config user.name test", expect: allow }
  - { cmd: "cat .git/hooks/pre-commit", expect: allow, note: "reading a hook" }
  - { cmd: "ls .husky", expect: allow }
  - { cmd: "git commit -m 'fix'", expect: allow, note: "a commit runs the hooks; it does not change them" }
  - { tool: Read, input: { file_path: "/work/app/.husky/pre-commit" }, expect: allow }
  - { tool: Write, input: { file_path: "/work/app/docs/git-hooks.md", content: "" }, expect: allow, note: "a page about hooks is not a hook" }
  - { tool: Write, input: { file_path: "/work/app/src/hooks/useThing.ts", content: "" }, expect: allow, note: "a React hooks folder is not .git/hooks" }
  - { cmd: "git config core.hooksPath /dev/null", expect: allow, bylaws: { version: 1, guards: { self-protect: { decision: allow } } }, note: "the guard switched off" }
