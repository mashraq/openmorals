# The delete guard (0.21.0): a plain delete of any existing file. When the project trash can take every target, the call
# is refused and the reason names `openmorals trash <path>` (delete.trash); when it cannot (outside the project, another
# volume, a secret file, openmorals' own folders, a project rooted at the home folder, an unreadable file) the call asks
# (delete.ask); a path built at run time is refused (delete.blind). rm -r, wildcards and other forced deletes stay with
# the destructive guard; since 0.41.3 rm -f of plain names in the project, with no other option, is judged here. Each
# row's `files` says what is on disk (every other path is missing); rows run in /work/app. Since 0.22.0:
# a document the trash can take is refused like any file (the document guard keeps a document the trash cannot take);
# a move into a temp folder deletes its source, and mv/cp onto an existing file deletes the file replaced.
guard: delete
x-files:
  code: &code { text: "export const x = 1;\n", repeat: 20 }
cases:
  # --- plain deletes the trash can take: refused, with the trash command named
  - { cmd: "rm src/a.js", files: { src/a.js: *code }, expect: deny, rule: delete.trash }
  - { cmd: "rm server.log", files: { server.log: { bytes: 3000 } }, expect: deny, rule: delete.trash, note: "not a document, still a file" }
  - { cmd: "unlink build.log", files: { build.log: { bytes: 120 } }, expect: deny, rule: delete.trash }
  - { cmd: "rm src/a.js src/b.js", files: { src/a.js: *code, src/b.js: *code }, expect: deny, rule: delete.trash }
  - { cmd: "git rm -q src/old.py", files: { src/old.py: { bytes: 900 } }, expect: deny, rule: delete.trash, note: "git could restore it; that is not an exemption" }
  - { cmd: "Remove-Item src/old.ps1", shell: powershell, files: { src/old.ps1: { bytes: 400 } }, expect: deny, rule: delete.trash }
  - { cmd: "del data.csv", shell: cmd, files: { data.csv: { bytes: 5000 } }, expect: deny, rule: delete.trash }
  - { cmd: "erase photo.jpg", shell: cmd, files: { photo.jpg: { bytes: 250000 } }, expect: deny, rule: delete.trash }
  - { cmd: "rm photo.jpg", files: { photo.jpg: { bytes: 250000 } }, expect: deny, rule: delete.trash, note: "photos, video, csv, json, zip are not documents but are files" }
  - { cmd: "rm export.json backup.zip", files: { export.json: { bytes: 800 }, backup.zip: { bytes: 90000 } }, expect: deny, rule: delete.trash }
  - { cmd: "rm Makefile", files: { Makefile: { bytes: 300 } }, expect: deny, rule: delete.trash, note: "a file with no extension" }
  - { cmd: "rm node_modules/pkg/index.js", files: { node_modules/pkg/index.js: { bytes: 70 } }, expect: deny, rule: delete.trash, note: "no folder is exempt" }
  - { cmd: "rm dist/app.js", files: { dist/app.js: { bytes: 70 } }, expect: deny, rule: delete.trash }
  - { cmd: "rm -i src/a.js", files: { src/a.js: *code }, expect: deny, rule: delete.trash, note: "-i asks a terminal the agent answers itself" }
  - { cmd: "rm -f src/a.js", files: { src/a.js: *code }, expect: deny, rule: delete.trash, note: "0.41.3: rm -f of named files is judged as rm (until then the destructive guard asked)" }
  - { cmd: "rm -f src/a.js src/b.js", files: { src/a.js: *code, src/b.js: *code }, expect: deny, rule: delete.trash, note: "0.41.3" }
  - { cmd: "rm --force -- src/a.js", files: { src/a.js: *code }, expect: deny, rule: delete.trash, note: "0.41.3" }
  - { cmd: "rm -f build.log", files: { build.log: { bytes: 64 } }, bylaws: { version: 1, guards: { destructive: { allow_targets: [build.log] } } }, expect: deny, rule: delete.trash, note: "0.41.3: a name in destructive allow_targets, as rm of it (until then rm -f of it was allowed)" }
  - { cmd: "rm build.log", files: { build.log: { bytes: 64 } }, bylaws: { version: 1, guards: { destructive: { allow_targets: [build.log] } } }, expect: deny, rule: delete.trash, note: "allow_targets is the destructive guard's: a plain rm of the name is steered to the trash" }
  - { tool: mcp__files__delete_file, input: { path: src/a.js }, files: { src/a.js: *code }, expect: deny, rule: delete.trash, note: "an MCP tool that deletes a path it names" }
  - { tool: mcp__fs__remove_file, input: { file_path: /work/app/report.csv }, files: { report.csv: { bytes: 1000 } }, expect: deny, rule: delete.trash }
  # --- deletes the trash cannot take: ask
  - { cmd: "rm /srv/shared/x.bin", files: { /srv/shared/x.bin: { bytes: 64 } }, expect: ask, rule: delete.ask, note: "outside the project folder" }
  - { cmd: "cd /srv/shared && rm -f x.bin", files: { /srv/shared/x.bin: { bytes: 64 } }, expect: ask, rule: delete.ask, note: "0.41.3: rm -f after a cd out of the project asks as rm does" }
  - { cmd: "rm -rf src", files: { src: { folder: true }, src/a.js: *code }, expect: ask, rule: destructive.recursive-delete, note: "0.41.3: recursive deletes stay with the destructive guard" }
  - { cmd: "rm ~/Downloads/photo.jpg", files: { ~/Downloads/photo.jpg: { bytes: 64000 } }, expect: ask, rule: delete.ask }
  - { cmd: "rm /tmp/run-output.bin", files: { /tmp/run-output.bin: { bytes: 64 } }, expect: ask, rule: delete.ask, note: "a temp file: the reason says it can be left" }
  - { cmd: "rm mnt/disk/a.bin", files: { .: { folder: true, volume: 1 }, mnt/disk/a.bin: { bytes: 64, volume: 2 } }, expect: ask, rule: delete.ask, note: "another volume: the trash is a rename" }
  - { cmd: "rm locked.bin", files: { locked.bin: { error: EACCES } }, expect: ask, rule: delete.ask }
  - { cmd: "rm app.js", cwd: /home/u, files: { app.js: { bytes: 10 } }, expect: ask, rule: delete.ask, note: "a session rooted at the home folder: the trash refuses it" }
  - { cmd: "rm config/credentials.json", files: { config/credentials.json: { bytes: 300 } }, bylaws: { version: 1, guards: { secrets: { read: allow } } }, expect: ask, rule: delete.ask, note: "a secret file: the trash would keep it on disk, so it asks (the secrets guard's own ask switched off here to show it)" }
  - { tool: mcp__files__delete_file, input: { path: /srv/shared/x.bin }, files: { /srv/shared/x.bin: { bytes: 64 } }, bylaws: { version: 1, guards: { online-delete: { decision: allow } } }, expect: ask, rule: delete.ask, note: "the adapter's MCP-delete ask switched off here, to show this guard's own" }
  - { cmd: "rm .env", files: { .env: "API_KEY=fake-not-real\n" }, expect: ask, rule: secrets.read, note: "the secrets guard asks first; the delete guard asks too, never steers a secret to the trash" }
  - { cmd: "rm .openmorals/trash/20260101T000000Z-ab12cd34/a.js", files: { .openmorals/trash/20260101T000000Z-ab12cd34/a.js: { bytes: 10 } }, expect: ask, rule: self-protect.write }
  # --- the real delete is purge, which only the person runs; a trashed secret stays guarded
  - { cmd: "openmorals purge --older-than 0 --yes", expect: ask, rule: self-protect.write, note: "an agent is asked before it purges" }
  - { cmd: "npx openmorals purge 20260101T000000Z-ab12cd34 --yes", expect: ask, rule: self-protect.write }
  - { cmd: "node node_modules/openmorals/dist/src/cli.js purge --older-than 0 --yes", expect: ask, rule: self-protect.write }
  - { cmd: "python -m openmorals purge --older-than 0", expect: ask, rule: self-protect.write }
  - { tool: Read, input: { file_path: /work/app/.openmorals/trash/20260101T000000Z-ab12cd34/.env }, expect: ask, rule: secrets.read, note: "a trashed .env is still a secret file" }
  - { cmd: "openmorals trash .env", files: { .env: "API_KEY=fake-not-real\n" }, expect: ask, rule: secrets.read }
  # --- paths built at run time: refused
  - { cmd: "rm $f", expect: deny, rule: delete.blind }
  - { cmd: "rm \"$OUT/a.txt\"", expect: deny, rule: delete.blind }
  - { cmd: "rm `cat list.txt`", expect: deny, rule: delete.blind }
  - { cmd: "rm $(cat list.txt)", expect: deny, rule: delete.blind }
  - { cmd: "for f in a.js b.js; do rm \"$f\"; done", expect: deny, rule: delete.blind }
  - { cmd: "del %TEMP%\\x.txt", shell: cmd, expect: deny, rule: delete.blind }
  - { cmd: "Remove-Item $env:TEMP/x.txt", shell: powershell, expect: deny, rule: delete.blind }
  # --- after a change of folder in the same call (0.21.1): the target is read from the new folder
  - { cmd: "cd sub && rm c.py", files: { sub: { folder: true }, sub/c.py: *code }, expect: deny, rule: delete.trash, note: "the trash command names sub/c.py" }
  - { cmd: "cd sub; unlink c.py", files: { sub/c.py: *code }, expect: deny, rule: delete.trash }
  - { cmd: "(cd sub && rm c.py)", files: { sub/c.py: *code }, expect: deny, rule: delete.trash, note: "a subshell" }
  - { cmd: "pushd sub && rm c.py && popd", files: { sub/c.py: *code }, expect: deny, rule: delete.trash }
  - { cmd: "Set-Location sub; Remove-Item c.py", shell: powershell, files: { sub/c.py: *code }, expect: deny, rule: delete.trash }
  - { cmd: "cd sub & del c.py", shell: cmd, files: { sub/c.py: *code }, expect: deny, rule: delete.trash }
  - { cmd: "git -C sub rm c.py", files: { sub/c.py: *code }, expect: deny, rule: delete.trash }
  - { cmd: "cd sub && git rm -q c.py", files: { sub/c.py: *code }, expect: deny, rule: delete.trash }
  - { cmd: "cd .. && rm app/sub/c.py", files: { sub/c.py: *code }, expect: deny, rule: delete.trash }
  - { cmd: "cd sub/deep && rm ../c.py", files: { sub/c.py: *code }, expect: deny, rule: delete.trash }
  - { cmd: "bash -c 'cd sub && rm c.py'", files: { sub/c.py: *code }, expect: deny, rule: delete.trash }
  - { cmd: "cd /srv/shared && rm x.bin", files: { /srv/shared/x.bin: { bytes: 64 } }, expect: ask, rule: delete.ask, note: "the new folder is outside the project" }
  - { cmd: "git rm -r lib/old", files: { lib/old: { folder: true } }, expect: deny, rule: delete.trash, note: "a folder: openmorals trash takes it, then git rm -r --cached" }
  - { cmd: "git rm -r -q /srv/shared/old", files: { /srv/shared/old: { folder: true } }, expect: ask, rule: delete.ask }
  # --- a change to a folder openmorals cannot know, then a relative delete: refused
  - { cmd: "cd \"$D\" && rm c.py", expect: deny, rule: delete.blind }
  - { cmd: "cd - && rm c.py", expect: deny, rule: delete.blind }
  - { cmd: "cd $(git rev-parse --show-toplevel) && rm sub/c.py", expect: deny, rule: delete.blind }
  - { cmd: "popd && rm c.py", expect: deny, rule: delete.blind, note: "a popd with nothing pushed in this call" }
  - { cmd: "git -C \"$REPO\" rm c.py", expect: deny, rule: delete.blind }
  - { cmd: "Set-Location $env:TEMP; Remove-Item c.py", shell: powershell, expect: deny, rule: delete.blind }
  # --- 0.22.0: a move into a temp folder deletes the file (any file); the trash command is named
  - { cmd: "mv src/a.js /tmp/", files: { src/a.js: *code }, expect: deny, rule: delete.trash }
  - { cmd: "mv photo.jpg /tmp/old.jpg", files: { photo.jpg: { bytes: 250000 } }, expect: deny, rule: delete.trash }
  - { cmd: "mv data.csv $TMPDIR/", files: { data.csv: { bytes: 5000 } }, expect: deny, rule: delete.trash, note: "the temp-folder variable, by name" }
  - { cmd: "mv build.log /var/tmp/", files: { build.log: { bytes: 120 } }, expect: deny, rule: delete.trash }
  - { cmd: "mv export.json /private/var/folders/xy/abc123/T/", files: { export.json: { bytes: 800 } }, expect: deny, rule: delete.trash, note: "the macOS per-user temp folder" }
  - { cmd: "mv dist /tmp/old-dist", files: { dist: { folder: true } }, expect: deny, rule: delete.trash, note: "a folder moved into a temp folder" }
  - { cmd: "mv -t /tmp src/a.js src/b.js", files: { src/a.js: *code, src/b.js: *code }, expect: deny, rule: delete.trash }
  - { cmd: "cd sub && mv c.py /tmp/", files: { sub/c.py: *code }, expect: deny, rule: delete.trash, note: "judged in the folder the cd names" }
  - { cmd: "Move-Item report.csv $env:TEMP", shell: powershell, files: { report.csv: { bytes: 1000 } }, expect: deny, rule: delete.trash }
  - { cmd: "move report.csv %TEMP%", shell: cmd, files: { report.csv: { bytes: 1000 } }, expect: deny, rule: delete.trash }
  - { cmd: "mv /srv/shared/x.bin /tmp/", files: { /srv/shared/x.bin: { bytes: 64 } }, expect: ask, rule: delete.ask, note: "outside the project: the trash cannot take it" }
  - { cmd: "mv \"$f\" /tmp/", expect: deny, rule: delete.blind }
  - { cmd: "cd \"$D\" && mv c.py /tmp/", expect: deny, rule: delete.blind }
  - { cmd: "mv src/a.js ../other/", cwd: /tmp/proj, files: { src/a.js: *code }, expect: deny, rule: delete.trash, note: "a project inside a temp folder: out of it is still a temp folder" }
  # --- 0.22.0: mv or cp onto an existing file deletes the file it replaces (any file)
  - { cmd: "mv draft.js src/a.js", files: { draft.js: *code, src/a.js: *code }, expect: deny, rule: delete.trash, note: "the reason says: trash the old file first, then the mv" }
  - { cmd: "cp config.example config.json", files: { config.example: { bytes: 300 }, config.json: { bytes: 320 } }, expect: deny, rule: delete.trash }
  - { cmd: "cp -f photo2.jpg photo.jpg", files: { photo2.jpg: { bytes: 9000 }, photo.jpg: { bytes: 250000 } }, expect: deny, rule: delete.trash }
  - { cmd: "mv -n -f draft.js src/a.js", files: { draft.js: *code, src/a.js: *code }, expect: deny, rule: delete.trash, note: "the last of -n and -f decides" }
  - { cmd: "cp src/a.js lib/", files: { src/a.js: *code, lib: { folder: true }, lib/a.js: *code }, expect: deny, rule: delete.trash, note: "the file of the same name in the folder" }
  - { cmd: "git mv -f old.py new.py", files: { old.py: { bytes: 90 }, new.py: { bytes: 80 } }, expect: deny, rule: delete.trash }
  - { cmd: "Copy-Item a.bin b.bin", shell: powershell, files: { a.bin: { bytes: 9 }, b.bin: { bytes: 9 } }, expect: deny, rule: delete.trash }
  - { cmd: "Move-Item -Force a.bin b.bin", shell: powershell, files: { a.bin: { bytes: 9 }, b.bin: { bytes: 9 } }, expect: deny, rule: delete.trash }
  - { cmd: "copy /Y a.bin b.bin", shell: cmd, files: { a.bin: { bytes: 9 }, b.bin: { bytes: 9 } }, expect: deny, rule: delete.trash }
  - { cmd: "cd sub && cp ../draft.js c.py", files: { draft.js: *code, sub/c.py: *code }, expect: deny, rule: delete.trash }
  - { cmd: "cp src/a.js /srv/shared/x.bin", files: { src/a.js: *code, /srv/shared/x.bin: { bytes: 64 } }, expect: ask, rule: delete.ask }
  - { cmd: "cp .env.example .env", files: { .env.example: "API_KEY=\n", .env: "API_KEY=fake-not-real\n" }, bylaws: { version: 1, guards: { secrets: { read: allow } } }, expect: ask, rule: delete.ask, note: "a secret file is never steered to the trash" }
  # --- 0.22.0: documents inside the project are steered to the trash like any file
  - { cmd: "rm docs/guide.md", files: { docs/guide.md: { bytes: 2400 } }, expect: deny, rule: delete.trash, note: "was document.delete (ask) in 0.18.0-0.21.1" }
  - { cmd: "unlink notes.txt", files: { notes.txt: { bytes: 2400 } }, expect: deny, rule: delete.trash }
  - { cmd: "git rm -q docs/guide.md", files: { docs/guide.md: { bytes: 2400 } }, expect: deny, rule: delete.trash }
  - { cmd: "Remove-Item notes.md", shell: powershell, files: { notes.md: { bytes: 2400 } }, expect: deny, rule: delete.trash }
  - { cmd: "cd docs && rm guide.md", files: { docs/guide.md: { bytes: 2400 } }, expect: deny, rule: delete.trash }
  - { cmd: "mv docs/guide.md /tmp/old-guide.md", files: { docs/guide.md: { bytes: 2400 } }, expect: deny, rule: delete.trash }
  - { cmd: "mv draft.md docs/guide.md", files: { draft.md: "# Draft\n", docs/guide.md: { bytes: 2400 } }, expect: deny, rule: delete.trash }
  - { tool: mcp__files__delete_file, input: { path: report.pdf }, files: { report.pdf: { bytes: 48000 } }, expect: deny, rule: delete.trash }
  - { cmd: "rm docs/guide.md", files: { docs/guide.md: { bytes: 2400 } }, bylaws: { version: 1, guards: { document: { decision: allow } } }, expect: deny, rule: delete.trash }
  - { cmd: "rm docs/guide.md", files: { docs/guide.md: { bytes: 2400 } }, bylaws: { version: 1, guards: { document: { decision: deny } } }, expect: deny, rule: delete.trash, note: "the document setting cannot make it weaker" }
  # --- settings
  - { cmd: "rm src/a.js", files: { src/a.js: *code }, bylaws: { version: 1, guards: { delete: { steer: ask } } }, expect: ask, rule: delete.ask, note: "steer: ask asks about each delete" }
  - { cmd: "rm /srv/shared/x.bin", files: { /srv/shared/x.bin: { bytes: 64 } }, bylaws: { version: 1, guards: { delete: { decision: deny } } }, expect: deny, rule: delete.ask }
  - { cmd: "rm src/a.js", files: { src/a.js: *code }, bylaws: { version: 1, guards: { delete: { decision: allow } } }, expect: allow, note: "allow switches the guard off" }
  - { cmd: "rm $f", bylaws: { version: 1, guards: { delete: { decision: allow } } }, expect: allow }
  - { cmd: "mv src/a.js /tmp/", files: { src/a.js: *code }, bylaws: { version: 1, guards: { delete: { steer: ask } } }, expect: ask, rule: delete.ask }
  - { cmd: "mv draft.js src/a.js", files: { draft.js: *code, src/a.js: *code }, bylaws: { version: 1, guards: { delete: { steer: ask } } }, expect: ask, rule: delete.ask }
  - { cmd: "mv docs/guide.md /tmp/", files: { docs/guide.md: { bytes: 2400 } }, bylaws: { version: 1, guards: { delete: { steer: ask }, document: { decision: deny } } }, expect: deny, rule: delete.ask, note: "the stricter of the delete and document settings" }
  - { cmd: "mv src/a.js /tmp/", files: { src/a.js: *code }, bylaws: { version: 1, guards: { delete: { decision: allow } } }, expect: allow }
  # --- ordinary work: silent
  - { cmd: "rm missing.js", expect: allow, note: "nothing there" }
  - { cmd: "rm \"$HOME/never-made.txt\"", expect: allow, note: "$HOME is known, and nothing is there" }
  - { cmd: "rm src", files: { src: { folder: true } }, expect: allow, note: "plain rm cannot delete a folder" }
  - { cmd: "git rm --cached src/a.js", files: { src/a.js: *code }, expect: allow, note: "stops tracking, deletes nothing" }
  - { cmd: "openmorals trash src/a.js", files: { src/a.js: *code }, expect: allow }
  - { cmd: "openmorals trash $f", expect: allow, note: "the trash refuses anything outside the project" }
  - { cmd: "mv src/a.js src/b.js", files: { src/a.js: *code }, expect: allow }
  - { cmd: "cat src/a.js", files: { src/a.js: *code }, expect: allow }
  - { cmd: "rm -f missing.js", expect: allow, note: "0.41.3: rm -f of a named file is judged as rm: nothing there" }
  - { tool: Write, input: { file_path: /work/app/src/a.js, content: "export const x = 2;\n" }, files: { src/a.js: *code }, expect: allow }
  - { tool: mcp__files__write_file, input: { path: src/a.js, content: "x" }, files: { src/a.js: *code }, expect: allow }
  - { tool: mcp__files__read_file, input: { path: src/a.js }, files: { src/a.js: *code }, expect: allow }
  - { tool: Read, input: { file_path: /work/app/src/a.js }, files: { src/a.js: *code }, expect: allow }
  - { cmd: "ls -la src", files: { src: { folder: true } }, expect: allow }
  - { cmd: "cd sub && ls", files: { sub: { folder: true }, sub/c.py: *code }, expect: allow }
  - { cmd: "cd sub && npm test", files: { sub: { folder: true }, sub/c.py: *code }, expect: allow }
  - { cmd: "cd \"$D\" && ls -la", expect: allow, note: "a folder openmorals cannot know, and nothing deleted" }
  - { cmd: "cd sub && rm missing.py", files: { sub: { folder: true } }, expect: allow, note: "nothing there in either folder" }
  - { cmd: "cd \"$D\" && rm /work/app/never-made.js", expect: allow, note: "an absolute path does not depend on the folder" }
  - { cmd: "pushd sub && npm run build && popd", files: { sub: { folder: true } }, expect: allow }
  - { cmd: "git -C sub status", files: { sub: { folder: true } }, expect: allow }
  - { cmd: "git rm -r --cached lib/old", files: { lib/old: { folder: true } }, expect: allow }
  - { cmd: "mv -n draft.js src/a.js", files: { draft.js: *code, src/a.js: *code }, expect: allow, note: "0.22.0: no-clobber replaces nothing" }
  - { cmd: "cp -n config.example config.json", files: { config.example: { bytes: 300 }, config.json: { bytes: 320 } }, expect: allow }
  - { cmd: "cp --no-clobber a.bin b.bin", files: { a.bin: { bytes: 9 }, b.bin: { bytes: 9 } }, expect: allow }
  - { cmd: "cp -b draft.js src/a.js", files: { draft.js: *code, src/a.js: *code }, expect: allow, note: "a backup keeps the old file" }
  - { cmd: "mv src/a.js lib/", files: { src/a.js: *code, lib: { folder: true } }, expect: allow, note: "into a folder, replacing nothing" }
  - { cmd: "cp src/a.js src/a.backup.js", files: { src/a.js: *code }, expect: allow }
  - { cmd: "cp src/a.js /tmp/a.js", files: { src/a.js: *code }, expect: allow, note: "a copy into a temp folder keeps the file" }
  - { cmd: "mv build.log /srv/archive/", files: { build.log: { bytes: 120 }, /srv/archive: { folder: true } }, expect: allow, note: "moved out, not into a temp folder: kept" }
  - { cmd: "mv photo.jpg ~/Pictures/", files: { photo.jpg: { bytes: 250000 } }, expect: allow }
  - { cmd: "git mv old.py new.py", files: { old.py: { bytes: 90 }, new.py: { bytes: 80 } }, expect: allow, note: "git refuses to replace without -f" }
  - { cmd: "git mv src/a.js lib/a.js", files: { src/a.js: *code, lib: { folder: true } }, expect: allow }
  - { cmd: "Move-Item a.bin b.bin", shell: powershell, files: { a.bin: { bytes: 9 }, b.bin: { bytes: 9 } }, expect: allow, note: "Move-Item replaces only with -Force" }
  - { cmd: "Rename-Item a.bin b.bin", shell: powershell, files: { a.bin: { bytes: 9 }, b.bin: { bytes: 9 } }, expect: allow }
  - { cmd: "mv /tmp/run.bin /tmp/run-old.bin", files: { /tmp/run.bin: { bytes: 9 } }, expect: allow, note: "already in a temp folder" }
  - { cmd: "mv missing.js /tmp/", expect: allow, note: "nothing there" }
  - { cmd: "mv src/a.js sub/", cwd: /tmp/proj, files: { src/a.js: *code, sub: { folder: true } }, expect: allow, note: "a project inside a temp folder keeps its own folders" }
  - { cmd: "cp draft.csv data.csv", files: { draft.csv: "a,b\n", data.csv: "name,amount\nrent,1200\n" }, bylaws: { version: 1, guards: { replace: { steer: keep } } }, expect: deny, rule: delete.trash, note: "0.24.0: with guards.replace on, mv/cp onto a file stays this guard's" }
