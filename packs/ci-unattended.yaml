# pack: ci-unattended - for CI and other runs with nobody watching: never asks, refuses instead.
# Nobody can answer a question in CI, so every guard is set to deny and the soft budget limits are off.
# The engine itself still answers "ask" when it fails closed (unparseable command, invalid bylaws,
# internal error); run it with `openmorals hook claude-code --unattended` (or check --unattended),
# which turns every "ask" into "deny".
version: 1

guards:
  destructive:
    decision: deny
    allow_targets: [dist, build, coverage]
  online-delete:
    decision: deny
  secrets:
    read: deny
    write: deny
    send: deny
    hard: true
  self-protect:
    decision: deny
  budget:
    tool_calls: { soft: 0, hard: 800, step: 1 }
    tokens: { soft: 0, hard: 3000000, step: 1 }
  loop:
    decision: deny
  taint:
    decision: deny

rules:
  - id: ci-no-push
    match: { command: "\\bgit\\s+(-\\S+\\s+)*push\\b" }
    decision: deny
    reason: Pushing from an unattended run is refused; let the pipeline publish.
  - id: ci-no-publish
    match: { command: "\\b(npm|pnpm|yarn)\\s+publish\\b|\\bcargo\\s+publish\\b|\\btwine\\s+upload\\b|\\bgh\\s+release\\s+create\\b" }
    decision: deny
    reason: Publishing from an unattended agent run is refused.
  - id: ci-no-pipe-to-shell
    match: { command: "\\b(curl|wget|iwr|invoke-webrequest)\\b[^|]*\\|\\s*(sudo\\s+)?(ba|z|da|k)?sh\\b|\\|\\s*(iex|invoke-expression)\\b" }
    decision: deny
    reason: Piping a download straight into a shell runs code nobody has read.
    hard: true
  - id: ci-no-sudo
    match: { command: "(^|[\\s;&|(])(sudo|doas)\\s" }
    decision: deny
    reason: No administrator commands in unattended runs.

audit:
  enabled: true
