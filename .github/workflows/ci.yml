name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: The CLI answers on this OS
        run: |
          node dist/src/cli.js check "git status"
          node dist/src/cli.js sandbox plan

  sandbox-linux:
    name: sandbox run under bubblewrap (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: npm ci
      - run: npm run build
      - name: A command runs inside the sandbox
        run: node dist/src/cli.js sandbox run -- /bin/echo hello from the sandbox
      - name: A write inside the project is allowed
        run: |
          node dist/src/cli.js sandbox run -- /usr/bin/touch inside.txt
          test -f inside.txt
      - name: A write outside the project is refused
        run: |
          if node dist/src/cli.js sandbox run -- /usr/bin/touch "$HOME/openmorals-outside.txt"; then
            echo "the write outside the project was not refused"; exit 1
          fi
          test ! -e "$HOME/openmorals-outside.txt"

  binary-and-python:
    name: binary + python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: '3.9' }
          - { os: ubuntu-24.04, python: '3.13' }
          - { os: macos-15, python: '3.13' }
          - { os: windows-2025, python: '3.13' }
    env:
      OPENMORALS_HOME: ${{ github.workspace }}/.om-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-binary.mjs
      - name: The binary gives the same answers as the Node CLI
        run: node scripts/compare-binary.mjs build/openmorals${{ runner.os == 'Windows' && '.exe' || '' }} --timing 5
      - name: Python wrapper tests against the binary
        env:
          OPENMORALS_TEST_BINARY: build/openmorals${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python -m unittest discover -s python/tests -v
