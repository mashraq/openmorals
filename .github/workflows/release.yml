name: release

# A v* tag builds the single-file binary and the Python wheel on each platform,
# smoke-tests both, writes SHA256SUMS and attaches everything to a GitHub release.
# Run it by hand (workflow_dispatch) for a dry run: the same builds and tests, the
# files uploaded as workflow artifacts only, no release created.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 26.13.1

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    # Node's docs say single executables on Intel macOS are not tested upstream, so
    # that one target may fail without stopping the others; the release then lists
    # only the targets that built (see docs/distribution.md).
    continue-on-error: ${{ matrix.target == 'macos-x64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04, ext: '' }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, ext: '' }
          - { target: macos-arm64, runner: macos-15, ext: '' }
          - { target: macos-x64, runner: macos-15-intel, ext: '' }
          - { target: windows-x64, runner: windows-2025, ext: '.exe' }
    env:
      BIN: build/openmorals-${{ matrix.target }}${{ matrix.ext }}
      OPENMORALS_HOME: ${{ github.workspace }}/.om-home
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-binary.mjs --release-name
      - name: Smoke test the binary
        run: |
          set -u
          "$BIN" --version
          "$BIN" check "git status"
          rc=0; "$BIN" check "rm -rf ~/projects" || rc=$?
          test "$rc" -eq 1 || { echo "rm -rf should ask (exit 1), got $rc"; exit 1; }
          "$BIN" packs
          "$BIN" sandbox plan
          mkdir -p "$RUNNER_TEMP/scan" && printf '# Greeting skill\n\nSay hello to the user.\n' > "$RUNNER_TEMP/scan/SKILL.md"
          "$BIN" scan "$RUNNER_TEMP/scan"
          out=$(echo '{"session_id":"smoke","hook_event_name":"PreToolUse","tool_name":"Bash","tool_input":{"command":"git push --force origin main"}}' | "$BIN" hook claude-code)
          echo "$out"
          echo "$out" | grep -q '"permissionDecision":"ask"'
      - name: Same answers as the Node CLI, and start time
        run: |
          echo "### ${{ matrix.target }}" >> "$GITHUB_STEP_SUMMARY"
          node scripts/compare-binary.mjs "$BIN" --timing 10 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Size
        run: echo "binary size $(wc -c < "$BIN") bytes" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build the Python wheel
        run: python python/build_wheel.py --binary "$BIN" --platform ${{ matrix.target }} --out build/wheels --third-party build/THIRD-PARTY-LICENSES.txt
      - name: Python wrapper tests against the binary
        env:
          OPENMORALS_TEST_BINARY: ${{ env.BIN }}
        run: python -m unittest discover -s python/tests -v
      - name: Install the wheel in a fresh virtual environment and run it
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -d "$RUNNER_TEMP/venv/Scripts" ]; then VBIN="$RUNNER_TEMP/venv/Scripts"; else VBIN="$RUNNER_TEMP/venv/bin"; fi
          "$VBIN/python" -m pip install --no-index build/wheels/*.whl
          "$VBIN/openmorals" --version
          rc=0; "$VBIN/openmorals" check "rm -rf ~/projects" || rc=$?
          test "$rc" -eq 1 || { echo "rm -rf should ask (exit 1) through pip, got $rc"; exit 1; }
          "$VBIN/python" -m openmorals check --json "git status"
          "$VBIN/python" -c "import openmorals; d = openmorals.check('git push --force origin main'); print(d); assert d.decision == 'ask', d"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ env.BIN }}
            build/wheels/*.whl
          if-no-files-found: error
          retention-days: 14
      - name: The licences of what the binary embeds (Node.js, yaml), once
        if: matrix.target == 'linux-x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-licences
          path: build/THIRD-PARTY-LICENSES.txt
          if-no-files-found: error
          retention-days: 14

  checksums:
    name: SHA256SUMS
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: A tag must match package.json
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="v$(node -p "require('./package.json').version")"
          test "$TAG" = "$want" || { echo "tag $TAG does not match package.json ($want)"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: out
      - name: Write SHA256SUMS
        run: |
          find out -mindepth 2 -type f -exec mv -t out {} +
          find out -mindepth 1 -type d -empty -delete
          cd out
          find . -maxdepth 1 -type f | sed 's|^\./||' | sort > ../files.txt
          test -s ../files.txt || { echo "no build produced anything"; exit 1; }
          xargs -a ../files.txt sha256sum > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: all-release-files
          path: out/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: GitHub release
    needs: checksums
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: all-release-files
          path: out
      - name: Verify, then create the release with the binaries, wheels and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cd out
          sha256sum -c SHA256SUMS
          gh release create "$TAG" --repo "$REPO" --verify-tag --title "openmorals $TAG" \
            --notes "Single-file binaries and Python wheels for $TAG. Check a download with: sha256sum -c SHA256SUMS --ignore-missing. Unsigned: see docs/distribution.md for macOS Gatekeeper and Windows SmartScreen." \
            ./*
